<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"
     role="img" aria-label="Architecture: OTLP-GenAI spans → ingest span tree → fork StateSnapshot → tui navigator">
  <defs>
    <marker id="ah-d" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#5A5A66"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="360" fill="#1D1D1F"/>

  <!-- static connectors -->
  <g stroke="#3A3A44" stroke-width="1.5" fill="none">
    <line x1="180" y1="180" x2="235" y2="180" marker-end="url(#ah-d)"/>
    <line x1="395" y1="180" x2="450" y2="180" marker-end="url(#ah-d)"/>
    <line x1="610" y1="180" x2="665" y2="180" marker-end="url(#ah-d)"/>
  </g>

  <!-- marching-dash data flow (direction = data direction, left→right) -->
  <g stroke-width="1.5" fill="none" stroke-linecap="round">
    <line x1="180" y1="180" x2="231" y2="180" stroke="#4DA3FF" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" repeatCount="indefinite"/>
    </line>
    <line x1="395" y1="180" x2="446" y2="180" stroke="#8985FF" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-0.55s" repeatCount="indefinite"/>
    </line>
    <line x1="610" y1="180" x2="661" y2="180" stroke="#2DC79A" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-1.1s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- data packets flowing along connectors -->
  <g>
    <circle r="3" fill="#4DA3FF">
      <animateMotion path="M180,180 L231,180" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#8985FF">
      <animateMotion path="M395,180 L446,180" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#2DC79A">
      <animateMotion path="M610,180 L661,180" dur="2.4s" begin="-0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-0.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- nodes (breathing fill-opacity, staggered) -->
  <g>
    <rect x="20" y="140" width="160" height="80" rx="15" fill="#4DA3FF" fill-opacity="0.16" stroke="#4DA3FF" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.16;0.24;0.16" keyTimes="0;0.5;1" dur="3.2s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="100" y="178" text-anchor="middle" font-size="14" font-weight="600" fill="#7FBFFF">OTLP-GenAI spans</text>
    <text x="100" y="196" text-anchor="middle" font-size="10" fill="#A1A1A8">recorded export</text>

    <rect x="235" y="140" width="160" height="80" rx="15" fill="#8985FF" fill-opacity="0.16" stroke="#8985FF" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.16;0.24;0.16" keyTimes="0;0.5;1" dur="3.2s" begin="-0.8s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="315" y="178" text-anchor="middle" font-size="14" font-weight="600" fill="#B9B6FF">ingest · span tree</text>
    <text x="315" y="196" text-anchor="middle" font-size="10" fill="#A1A1A8">OTLP-JSON parse</text>

    <rect x="450" y="140" width="160" height="80" rx="15" fill="#8985FF" fill-opacity="0.16" stroke="#8985FF" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.16;0.24;0.16" keyTimes="0;0.5;1" dur="3.2s" begin="-1.6s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="530" y="178" text-anchor="middle" font-size="14" font-weight="600" fill="#B9B6FF">fork · StateSnapshot</text>
    <text x="530" y="196" text-anchor="middle" font-size="10" fill="#A1A1A8">snapshot at span</text>

    <rect x="665" y="140" width="160" height="80" rx="15" fill="#2DC79A" fill-opacity="0.16" stroke="#2DC79A" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.16;0.24;0.16" keyTimes="0;0.5;1" dur="3.2s" begin="-2.4s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="745" y="178" text-anchor="middle" font-size="14" font-weight="600" fill="#5BE0B4">tui navigator</text>
    <text x="745" y="196" text-anchor="middle" font-size="10" fill="#A1A1A8">mark + dump</text>
  </g>

  <!-- flow caption -->
  <text x="440" y="290" text-anchor="middle" font-size="12" fill="#A1A1A8">single binary · pure functions · no network in v0.1</text>
</svg>
